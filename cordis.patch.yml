# dsh-session-control profile layer: applied automatically when installed
# as a profile bundle (package.json declares dsh.bundle.patch).
#
# The plugin occupies the sidebar body via the single-registrant
# "sidebar.workspaces" slot. The default ui-workspace row is disabled
# to yield the slot.
#
# In turn, uiWorkspace service required by dsh-client-ui-sidebar and
# dsh-client-ui-conversation is provided by this plugin's service half.
#
# Recovery: dsh plugin remove @goodandready/dsh-session-control
- id: ui-workspace
  disabled: true

- insert:
    - id: dsh-session-control
      name: '@goodandready/dsh-session-control'
      config: {}
